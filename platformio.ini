; platformio.ini - Team H03 (LatchBeat / MusicCard) Multi-Environment Build Config (Task H-01)
;
; Builds all three project targets from a single repository:
;   1. card_esp32dev   -> Current Breadboard & 2025 Card Prototype (HiLetgo ESP-32S)
;   2. card_esp32s3    -> V1 Custom PCB Controller Card / Leader (ESP32-S3-WROOM-1 / MINI-1)
;   3. follower_promini -> Hot-Swappable Follower Modules (Arduino Pro Mini 3.3V / 8MHz)

[platformio]
default_envs = card_esp32dev

[env]
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
    -I include

; 1. Current Breadboard & 2025 Card Prototype (HiLetgo ESP-32S / ESP-WROOM-32)
[env:card_esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
build_src_filter = +<card_main.cpp> -<follower_promini.cpp>

; 2. V1 Custom PCB Controller Card / Leader (ESP32-S3)
[env:card_esp32s3]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<card_main.cpp> -<follower_promini.cpp>

; 3. Follower Module Firmware (Arduino Pro Mini ATmega328P 3.3V 8MHz)
[env:follower_promini]
platform = atmelavr @ ^5.0.0
board = pro8MHzatmega328
framework = arduino
build_src_filter = +<follower_promini.cpp> -<card_main.cpp>
